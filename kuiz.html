<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kuiz Cabaran Detektif</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bangers&family=Yellowtail&display=swap">
<style>
/* Layout: aplikasi satu lajur gaya komik penyiasatan. Navy = dakwat utama, biru muda = latar, kuning = tindakan, hijau = betul, jingga = belum tepat. */
:root{
  --navy:#14213D; --sky:#D6ECFF; --dots:#BCDDFB; --card:#FFFFFF; --soft:#EEF6FF; --muted:#4D5A72;
  --yellow:#FFC93C; --yellow-soft:#FFF3CC; --green:#178A55; --green-soft:#DDF5E7; --orange:#E5640F; --orange-soft:#FFE8D6;
  --blue:#1F63F2; --red:#E23B4A; --shadow:#14213D; --on-yellow:#14213D;
  --f-display:"Bangers","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#EEF2FF; --sky:#0E1630; --dots:#18244A; --card:#18213F; --soft:#223058; --muted:#B5BEDA;
  --yellow:#FFC93C; --yellow-soft:#3B3216; --green:#4FD08E; --green-soft:#16382A; --orange:#FF9A55; --orange-soft:#41291A;
  --blue:#7AA5FF; --red:#FF7A85; --shadow:#04081A; --on-yellow:#14213D; color-scheme:dark }}
:root[data-theme="dark"]{
  --navy:#EEF2FF; --sky:#0E1630; --dots:#18244A; --card:#18213F; --soft:#223058; --muted:#B5BEDA;
  --yellow:#FFC93C; --yellow-soft:#3B3216; --green:#4FD08E; --green-soft:#16382A; --orange:#FF9A55; --orange-soft:#41291A;
  --blue:#7AA5FF; --red:#FF7A85; --shadow:#04081A; --on-yellow:#14213D; color-scheme:dark }

*{box-sizing:border-box}
body{background-color:var(--sky);background-image:radial-gradient(var(--dots) 2px,transparent 2.5px);background-size:16px 16px;color:var(--navy);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2.6rem} h2{font-size:1.9rem} h3{font-size:1.35rem}
p{margin:0}
.label{font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.panel{background:var(--card);border:3px solid var(--navy);border-radius:8px;box-shadow:6px 6px 0 var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;position:relative}
.caption{align-self:flex-start;background:var(--yellow);color:var(--on-yellow);border:2.5px solid var(--navy);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;transform:rotate(-1.5deg);margin:-34px 0 0 -6px}

/* Welcome */
.hero-img{border:3px solid var(--navy);border-radius:8px;overflow:hidden;box-shadow:5px 5px 0 var(--shadow);aspect-ratio:771/531;max-width:100%;background:#1c2540}
.hero-img img{display:block;width:100%;height:100%;object-fit:cover}
.title-block{display:flex;flex-direction:column;gap:6px}
.title-block h1{color:var(--navy);text-shadow:3px 3px 0 var(--yellow)}
.title-block .mission{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.04em;color:var(--blue)}
.say{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.avatar{width:64px;height:64px;border-radius:50%;border:3px solid var(--navy);overflow:hidden;background:#2a3456;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bubble{position:relative;background:var(--soft);border:3px solid var(--navy);border-radius:18px;padding:10px 14px;font-weight:700}
.bubble::before{content:"";position:absolute;left:-12px;top:18px;width:18px;height:18px;background:var(--soft);border-left:3px solid var(--navy);border-bottom:3px solid var(--navy);transform:rotate(45deg)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 200px;min-width:0}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text]{font:inherit;font-weight:400;color:var(--navy);background:var(--soft);border:2.5px solid var(--navy);border-radius:8px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.note{font-size:.88rem;color:var(--muted)}

.btn{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.05em;border:3px solid var(--navy);border-radius:10px;padding:10px 18px;min-height:52px;cursor:pointer;background:var(--yellow);color:var(--on-yellow);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.big{width:100%;font-size:1.7rem}
.btn.ghost{background:var(--card);color:var(--navy)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns .btn{flex:1 1 180px}

/* Status bar */
.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.stat{background:var(--card);border:2.5px solid var(--navy);border-radius:8px;padding:6px 12px;text-align:center;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;letter-spacing:.04em;line-height:1.1}
.bar{height:18px;border:2.5px solid var(--navy);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--yellow) 0 10px,#FFB000 10px 20px);transition:width .4s}
.bar-wrap{display:flex;flex-direction:column;gap:4px;min-width:0}

/* Map */
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.file{font:inherit;color:var(--navy);text-align:left;position:relative;border:3px solid var(--navy);border-radius:4px 14px 8px 8px;background:#F4D58D;padding:26px 14px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--shadow);cursor:pointer;min-height:132px;transition:transform .08s,box-shadow .08s}
.file::before{content:"";position:absolute;left:-3px;top:-16px;width:46%;height:16px;background:#F4D58D;border:3px solid var(--navy);border-bottom:0;border-radius:8px 8px 0 0}
.file:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.file[disabled]{cursor:not-allowed;background:#D9DDE6}
.file[disabled]::before{background:#D9DDE6}
.file .fno{font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:#14213D}
.file .fname{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.03em;line-height:1.05;color:#14213D}
.file .fico{position:absolute;right:12px;top:12px;width:34px;height:34px}
.stamp{align-self:flex-start;margin-top:auto;font-weight:700;font-size:.8rem;letter-spacing:.1em;border:2.5px solid currentColor;border-radius:4px;padding:2px 8px;transform:rotate(-4deg)}
.stamp.lock{color:#6B7280}
.stamp.open{color:#1F63F2;background:#fff}
.stamp.done{color:#178A55;background:#fff}
.file .fprog{font-size:.85rem;color:#14213D;font-weight:700}

/* Question */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font-weight:700;font-size:.8rem;border:2px solid var(--navy);border-radius:999px;padding:2px 10px;background:var(--yellow-soft)}
.qtext{font-size:1.12rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;color:var(--navy);text-align:left;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;border:3px solid var(--navy);border-radius:10px;background:var(--card);padding:10px 12px;min-height:56px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px)}
.opt .let{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;background:var(--soft)}
.opt[disabled]{cursor:default;box-shadow:none}
.opt.right{background:var(--green-soft);border-color:var(--green)}
.opt.right .let{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--orange-soft);border-color:var(--orange)}
.opt.wrong .let{background:var(--orange);border-color:var(--orange);color:#fff}
.opt .tag{grid-column:2;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.opt.right .tag{color:var(--green)} .opt.wrong .tag{color:var(--orange)}
.fb{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;border:3px solid var(--navy);border-radius:16px;padding:12px 14px}
.fb .avatar{width:56px;height:56px}
.fb.ok{background:var(--green-soft)} .fb.no{background:var(--orange-soft)}
.fb h3{font-size:1.45rem}
.fb.ok h3{color:var(--green)} .fb.no h3{color:var(--orange)}
.fb .body{display:flex;flex-direction:column;gap:6px}
.fb .ans{font-weight:700}

/* Result */
.result-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.badge{width:130px;height:130px}
.badge-name{font-family:var(--f-display);font-size:2rem;letter-spacing:.04em;line-height:1}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid-stats div{background:var(--soft);border:2.5px solid var(--navy);border-radius:8px;padding:8px 12px;font-variant-numeric:tabular-nums}
.grid-stats b{display:block;font-family:var(--f-display);font-size:1.7rem;letter-spacing:.04em;line-height:1.1}
.remind{background:var(--yellow-soft);border:2.5px solid var(--navy);border-left:8px solid var(--blue);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.cert-box{display:flex;flex-direction:column;gap:10px;background:var(--yellow-soft);border:3px solid var(--navy);border-radius:12px;padding:14px}
.cert-box h3{margin:0;font-family:var(--f-display);font-size:1.5rem;letter-spacing:.04em}
.cert-imgs{display:grid;gap:12px}
.cert-imgs figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cert-imgs img{width:100%;height:auto;border:2.5px solid var(--navy);border-radius:6px;background:#fff}
.session-note{background:var(--yellow-soft);border:2.5px dashed var(--navy);border-radius:8px;padding:10px 14px;font-size:.92rem}

/* Review */
.rv{border:3px solid var(--navy);border-radius:8px;overflow:hidden;background:var(--card)}
.rv-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:2.5px solid var(--navy);background:var(--soft);flex-wrap:wrap}
.rv.no{border-color:var(--orange);box-shadow:5px 5px 0 var(--orange)}
.rv.no .rv-head{background:var(--orange-soft)}
.rv.ok .rv-head{background:var(--green-soft)}
.rv-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.rv .flag{font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 10px;color:#fff}
.rv.no .flag{background:var(--orange)} .rv.ok .flag{background:var(--green)}
.rv dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.rv dt{font-weight:700;color:var(--muted);font-size:.9rem}
.rv dd{margin:0}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--blue)}

.burst{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5) rotate(-8deg);z-index:30;pointer-events:none;opacity:0}
.burst.show{animation:burst .9s ease forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-4deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border:1.5px solid #14213D;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){ .burst.show{animation:none;opacity:0} .confetti{display:none} .btn,.opt,.file{transition:none} .bar i{transition:none} }
@media (max-width:440px){ h1{font-size:2.1rem} .panel{padding:16px} .result-top{grid-template-columns:1fr;justify-items:center;text-align:center} .status{grid-template-columns:1fr 1fr} .status .bar-wrap{grid-column:1/-1} }
</style>

<div class="wrap" id="app" aria-live="polite"></div>
<div class="burst" id="burst" aria-hidden="true"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

/* Nama panggilan: buang bin/binti/a/l/a/p dan seterusnya, maksimum 3 perkataan */
function panggil(n){
  n = (n || '').trim().replace(/\s+/g, ' ');
  if(!n) return '';
  return n.split(/\s+(?:bin|binti|bt|bte|b\.|bt\.|a\/l|a\/p|anak)\s+/i)[0].split(' ').slice(0, 3).join(' ');
}

  const a = panggil(state.name), b = panggil(state.name2);

}

function openFile(id){
  if(fileStatus(id) === 'lock') return;
  const idx = qIndexes(id);
  const next = idx.find(i => state.answers[i] === null);
  state.current = next !== undefined ? next : idx[0];
  go('question');
}

/* ---------- Skrin C & D: Soalan dan maklum balas ---------- */
function renderQuestion(){
  const i = state.current, q = QUESTIONS[i], f = FILES[q.file - 1], a = state.answers[i], answered = a !== null;
  const idx = qIndexes(q.file), lastInFile = idx[idx.length - 1] === i, lastAll = i === TOTAL - 1;
  let nextLabel = 'Soalan Seterusnya';
  if(lastInFile) nextLabel = lastAll ? 'Lihat Keputusan' : 'Selesaikan Fail Kes';
  $('#app').innerHTML = `
    <section class="panel">
      <span class="caption">Fail Kes ${f.id}: ${esc(f.title)}</span>
      ${statusBar()}
      <div class="qhead"><span class="label">Soalan ${i + 1} daripada ${TOTAL}</span><span class="chip">Aras: ${esc(q.level)}</span></div>
      <p class="qtext">${esc(q.text)}</p>
      <div class="opts" role="group" aria-label="Pilihan jawapan">
        ${q.options.map((o, j) => {
          let cls = '', tag = '';
          if(answered){
            if(j === q.answer){ cls = 'right'; tag = 'Jawapan betul'; }
            else if(j === a){ cls = 'wrong'; tag = 'Pilihan kamu'; }
          }
          return `<button type="button" class="opt ${cls}" data-opt="${j}" ${answered ? 'disabled' : ''}><span class="let">${LETTERS[j]}</span><span>${esc(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</button>`;
        }).join('')}
      </div>
      <div id="fb">${answered ? feedbackHTML(i) : ''}</div>
      <div class="btns">
        <button class="btn ghost" type="button" id="toMap">Peta Misi</button>
        ${answered ? `<button class="btn" type="button" id="next">${nextLabel}</button>` : ''}
      </div>
    </section>`;
  $$('[data-opt]').forEach(b => b.onclick = () => choose(i, +b.dataset.opt));
  $('#toMap').onclick = () => go('map');
  const n = $('#next'); if(n) n.onclick = () => nextStep(i);
}
function feedbackHTML(i){
  const q = QUESTIONS[i], a = state.answers[i], ok = a === q.answer;
  return `<div class="fb ${ok ? 'ok' : 'no'}">${face()}<div class="body">
    <h3>${ok ? 'Tepat, Detektif!' : 'Belum tepat, mari belajar semula.'}</h3>
    ${ok ? `<p class="ans">Jawapan ${LETTERS[q.answer]} betul: ${esc(q.options[q.answer])}</p>`
         : `<p class="ans">Kamu memilih ${LETTERS[a]}: ${esc(q.options[a])}</p><p class="ans">Jawapan betul ialah ${LETTERS[q.answer]}: ${esc(q.options[q.answer])}</p>`}
    <p><b>Penerangan saintifik:</b> ${esc(q.explain)}</p>
  </div></div>`;
}
function choose(i, j){
  if(state.answers[i] !== null) return;          /* jawapan hanya dihantar sekali, tiada markah berganda */
  state.answers[i] = j;
  if(j === QUESTIONS[i].answer) burst('POW!', '#FFC93C');
  renderQuestion();
  const fb = $('#fb'); if(fb) fb.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'nearest' });
}
function nextStep(i){
  const q = QUESTIONS[i], idx = qIndexes(q.file);
  if(i === TOTAL - 1 && answeredCount() === TOTAL){ go('result'); return; }
  const nextInFile = idx.find(k => k > i && state.answers[k] === null);
  if(nextInFile !== undefined){ state.current = nextInFile; go('question'); return; }
  if(fileDone(q.file)) burst('ZAP!', '#7FD3FF');
  go(answeredCount() === TOTAL ? 'result' : 'map');
}

  x.fillStyle = NAVY; fitFont(x, 'DISAHKAN: DETEKTIF EL', DISP, 400, 32, 290); x.fillText('DISAHKAN: DETEKTIF EL', 0, 2); x.restore();
  // kanan: cas + pingat
  chargeDot(x, 1470, 190, 44, false, NAVY); chargeDot(x, 1600, 300, 36, true, NAVY); chargeDot(x, 1500, 400, 30, true, NAVY);
  const mx = 1545, my = 790;
  x.strokeStyle = NAVY; x.lineWidth = 5; x.fillStyle = '#EE3344'; x.beginPath(); x.moveTo(mx - 70, my + 90); x.lineTo(mx - 110, my + 260); x.lineTo(mx - 60, my + 230); x.lineTo(mx - 25, my + 280); x.lineTo(mx - 5, my + 120); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = BLUE; x.beginPath(); x.moveTo(mx + 70, my + 90); x.lineTo(mx + 110, my + 260); x.lineTo(mx + 60, my + 230); x.lineTo(mx + 25, my + 280); x.lineTo(mx + 5, my + 120); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = lv.color; x.lineWidth = 8; x.beginPath(); x.arc(mx, my, 150, 0, 7); x.fill(); x.stroke();
  x.strokeStyle = lv.ring; x.lineWidth = 6; x.beginPath(); x.arc(mx, my, 122, 0, 7); x.stroke();
  x.fillStyle = lv.ring; star(x, mx, my - 18, 70, 30, 5); x.fill(); x.strokeStyle = NAVY; x.lineWidth = 4; x.stroke();
  x.fillStyle = NAVY; fitFont(x, lv.name.split(' ').pop().toUpperCase(), DISP, 400, 44, 200); x.fillText(lv.name.split(' ').pop().toUpperCase(), mx, my + 92);
  return c;
}
let DL = null;
try{ if(window.claude && window.claude.use) window.claude.use('downloads').then(d => { DL = d; }).catch(() => {}); }catch(e){}
function certFileName(n){ return 'Sijil-' + (panggil(n) || 'Detektif').replace(/[^A-Za-z0-9]+/g, '-') + '.png'; }
async function buildCerts(lv, s){
  const box = $('#certImgs'); if(!box) return;
  const d = new Date(), dateStr = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
  const names = [state.name, state.name2].map(n => n.trim()).filter(Boolean);
  const out = [];
  for(const n of names){ const c = await drawCert(n, lv, state.cls.trim(), s, dateStr); out.push({ n, url: c.toDataURL('image/png'), c }); }
  box.innerHTML = out.map((o, i) => `<figure><img src="${o.url}" alt="Sijil pangkat ${esc(lv.name)} untuk ${esc(o.n)}"><button class="btn" type="button" data-dl="${i}">Muat turun sijil ${esc(panggil(o.n))} ↓</button></figure>`).join('');
  $$('[data-dl]').forEach(b => b.onclick = () => { const o = out[+b.dataset.dl]; o.c.toBlob(async bl => {
    if(DL){ try{ await DL.save({ filename: certFileName(o.n), data: bl }); }catch(e){ if(e && e.code !== 'declined') b.insertAdjacentHTML('afterend', '<p class="note">Muat turun tidak tersedia di sini. Tekan lama pada gambar sijil untuk simpan.</p>'); } return; }
    const u = URL.createObjectURL(bl), a = document.createElement('a'); a.href = u; a.download = certFileName(o.n); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }, 'image/png'); });
}

/* ---------- Skrin E: Keputusan ---------- */
function renderResult(){
  const s = score(), pct = Math.round(s / TOTAL * 100), lv = level(pct);
  $('#app').innerHTML = `
    <section class="panel">
      <span class="caption">Keputusan Siasatan</span>
      <div class="result-top">${badgeSVG(lv)}<div><span class="label">Lencana pencapaian</span><p class="badge-name">${lv.name}</p><p class="muted">${esc(state.name)}${state.name2.trim() ? ' &amp; ' + esc(state.name2) : ''} · ${esc(state.cls)}</p></div></div>
      <div class="grid-stats">
        <div><span class="label">Markah</span><b>${s} / ${TOTAL}</b></div>
        <div><span class="label">Peratus</span><b>${pct}%</b></div>
        <div><span class="label">Betul</span><b>${s}</b></div>
        <div><span class="label">Belum tepat</span><b>${TOTAL - s}</b></div>
      </div>
      <div class="say">${face()}<p class="bubble">${esc(lv.note)}</p></div>
      ${attemptNo === 1 ? `<div class="cert-box"><h3>Sijil pangkat kamu</h3>
        <p>Tahniah! Setiap ahli mendapat sijil sendiri. Tekan butang untuk muat turun, atau tekan lama pada gambar untuk simpan.</p>
        <div class="cert-imgs" id="certImgs"><p class="note">Sijil sedang disediakan…</p></div></div>` : `<p class="session-note">Sijil diberi untuk <b>percubaan pertama</b> sahaja. Percubaan ini untuk latihan dan ulang kaji.</p>`}
      ${FORM.url ? `<a class="btn big" href="${esc(formLink(s, pct, lv.name))}" target="_blank" rel="noopener">Hantar keputusan kepada guru \u2197</a>
      <p class="note">Borang guru akan dibuka dengan keputusan kamu sudah diisi. Semak nama, kemudian tekan <b>Hantar</b> dalam borang itu. Keputusan ini digunakan untuk sijil.</p>` : `<p class="session-note">Pautan borang guru belum ditetapkan. Tunjukkan skrin ini kepada guru.</p>`}
      <p class="session-note">Keputusan dalam aplikasi ini hanya tersedia sepanjang sesi dibuka. Aplikasi tidak menyimpan data. Keputusan hanya sampai kepada guru jika kamu menekan Hantar dalam borang guru.</p>
      <div class="btns">
        <button class="btn" type="button" id="review">Mod Ulang Kaji</button>
        <button class="btn ghost" type="button" id="toMap">Lihat Peta Misi</button>
        <button class="btn ghost" type="button" id="retry">Cuba Semula</button>
      </div>
    </section>`;
  $('#review').onclick = () => go('review');
  $('#toMap').onclick = () => go('map');
  $('#retry').onclick = retry;
  if(attemptNo === 1) buildCerts(lv, s);
  if(pct >= 70) confetti();
}

/* ---------- Skrin F: Mod Ulang Kaji ---------- */
function renderReview(){
  const wrong = QUESTIONS.filter((q, i) => state.answers[i] !== q.answer).length;
  $('#app').innerHTML = `
    <section class="panel">
      <span class="caption">Mod Ulang Kaji</span>
      <h2>Semak semula jawapan kamu</h2>
      <p class="muted">${wrong === 0 ? 'Semua jawapan tepat. Baca penerangan untuk mengukuhkan kefahaman.' : `${wrong} soalan bertanda jingga perlu diulang kaji.`}</p>
      <label class="toggle"><input type="checkbox" id="wrongOnly" ${state.wrongOnly ? 'checked' : ''} ${wrong === 0 ? 'disabled' : ''}> Tunjukkan soalan yang belum tepat sahaja</label>
      ${QUESTIONS.map((q, i) => {
        const a = state.answers[i], ok = a === q.answer;
        if(state.wrongOnly && ok) return '';
        return `<article class="rv ${ok ? 'ok' : 'no'}">
          <div class="rv-head"><span><b>Soalan ${i + 1}</b> · Fail Kes ${q.file}: ${esc(FILES[q.file - 1].title)}</span><span class="flag">${ok ? 'Betul' : 'Perlu ulang kaji'}</span></div>
          <div class="rv-body">
            <p><b>${esc(q.text)}</b></p>
            <dl>
              <dt>Jawapan kamu</dt><dd>${a !== null ? `${LETTERS[a]}. ${esc(q.options[a])}` : 'Tidak dijawab'}</dd>
              <dt>Jawapan betul</dt><dd>${LETTERS[q.answer]}. ${esc(q.options[q.answer])}</dd>
            </dl>
            <p><b>Penerangan saintifik:</b> ${esc(q.explain)}</p>
          </div></article>`;
      }).join('')}
      <div class="btns">
        <button class="btn ghost" type="button" id="toMap">Lihat Peta Misi</button>
        <button class="btn" type="button" id="retry">Cuba Semula</button>
      </div>
    </section>`;
  const w = $('#wrongOnly'); if(w) w.onchange = () => { state.wrongOnly = w.checked; renderReview(); };
  $('#toMap').onclick = () => go('map');
  $('#retry').onclick = retry;
}

/* ---------- Navigasi ---------- */
function retry(){ state = freshState(); attemptNo++; go('welcome'); }
function formLink(s, pct, tahap){
  const e = FORM.entry, q = new URLSearchParams({ usp: 'pp_url' });
  q.set(e.nama, state.name.trim()); q.set(e.nama2, state.name2.trim()); q.set(e.kelas, state.cls.trim());
  q.set(e.markah, `${s}/${TOTAL}`); q.set(e.peratus, pct); q.set(e.tahap, tahap); q.set(e.percubaan, attemptNo);
  return FORM.url + '?' + q.toString();
}   /* menetapkan semula keseluruhan sesi */
function go(screen){
  state.screen = screen;
  ({ welcome: renderWelcome, map: renderMap, question: renderQuestion, result: renderResult, review: renderReview })[screen]();
  window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' });
}
go('welcome');
</script>
